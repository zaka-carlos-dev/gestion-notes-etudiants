<!DOCTYPE html>
<html>
<head>
    <title>Gestion Notes - Zaka Carlos</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 40px auto; background: #f5f5f5; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px #ccc; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        h1 { color: #007bff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📚 Gestion de Notes Etudiants</h1>
        <p>Projet BTS IDA - Par <b>Zaka Judicael Carlos</b> | GitHub: zaka-carlos-dev</p>
        <form method="POST">
            <input type="text" name="nom" placeholder="Nom etudiant" required>
            <input type="text" name="matiere" placeholder="Matiere" required>
            <input type="text" name="note" placeholder="Note ex: 15/20" required>
            <button type="submit">Ajouter</button>
        </form>
    </div>
    <div class="card">
        <table>
            <tr><th>Nom</th><th>Matiere</th><th>Note</th><th>Action</th></tr>
            {% for e in etudiants %}
            <tr>
                <td>{{ e.nom }}</td>
                <td>{{ e.matiere }}</td>
                <td>{{ e.note }}</td>
                <td><a href="/delete/{{ loop.index0 }}" style="color:red;">Supprimer</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
